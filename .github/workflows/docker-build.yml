# Builds the multi-arch container image for the customized icloudpd.
#
# Like the rest of this repository, the image build does not carry upstream
# source: custom/Dockerfile fetches upstream at the pinned commit, applies
# custom/ on top and installs the result with pip. Installing the package
# instead of copying a PyInstaller binary in is what lets one Dockerfile cover
# amd64 and arm64 - every dependency upstream needs ships a wheel.
#
# The image goes to GitHub Container Registry, which needs no secret beyond the
# GITHUB_TOKEN this workflow already has. The upstream pins live here (not only
# in the Dockerfile) so that scripts/upstream_sync.py can move them along with
# the other three builds.

name: Build Docker image

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      # listed one by one rather than "custom/**" so that editing the docs does
      # not burn build minutes on an image that would come out identical
      - "custom/icloudpd-custom.patch"
      - "custom/guided_setup.py"
      - "custom/remember.py"
      - "custom/Dockerfile"
      - "custom/apply_customizations.sh"
      - "custom/docker-entrypoint.sh"
      - ".github/workflows/docker-build.yml"

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_REPO: icloud-photos-downloader/icloud_photos_downloader
  UPSTREAM_SHA: 879c561240d993d748ddb4546f935090502b16d3
  ICLOUDPD_VERSION: "1.32.3"
  ICLOUDPD_COMMIT_SHA: "879c561"
  ICLOUDPD_COMMIT_TS: "1780177342"
  IMAGE_NAME: icloudpd

jobs:
  build-image:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Work out the image name
        id: image
        # ghcr.io rejects any uppercase in the path, and the repository owner
        # is "Victor2820"
        run: |
          owner="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "repo=ghcr.io/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.repo }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.ICLOUDPD_VERSION }}
            type=raw,value=${{ env.ICLOUDPD_VERSION }}-b${{ github.run_number }}
          # Without these the action fills them in from the repository, and the
          # image goes out titled "iCloudpd-Mac-Win" with an empty license --
          # which is what `docker inspect` and `buildx imagetools inspect` show.
          # labels land in the image config, annotations on the manifest; both
          # default to the repository, so both have to be overridden.
          labels: |
            org.opencontainers.image.title=icloudpd
            org.opencontainers.image.description=iCloud Photos Downloader with a guided setup, a polling wait for unfinished iCloud indexing and opt-in --ignore-indexing-state
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.ICLOUDPD_VERSION }}
          annotations: |
            org.opencontainers.image.title=icloudpd
            org.opencontainers.image.description=iCloud Photos Downloader with a guided setup, a polling wait for unfinished iCloud indexing and opt-in --ignore-indexing-state
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ env.ICLOUDPD_VERSION }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./custom/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            UPSTREAM_REPO=${{ env.UPSTREAM_REPO }}
            UPSTREAM_SHA=${{ env.UPSTREAM_SHA }}
            ICLOUDPD_VERSION=${{ env.ICLOUDPD_VERSION }}
            ICLOUDPD_COMMIT_SHA=${{ env.ICLOUDPD_COMMIT_SHA }}
            ICLOUDPD_COMMIT_TS=${{ env.ICLOUDPD_COMMIT_TS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A green build only proves the patch applied. This proves the image that
      # was pushed actually exposes the customizations -- on both architectures,
      # because QEMU makes "it built" and "it runs" two different questions.
      - name: Smoke-test the pushed image
        env:
          IMAGE: ${{ steps.image.outputs.repo }}:${{ env.ICLOUDPD_VERSION }}-b${{ github.run_number }}
        run: |
          set -eu
          echo "checking $IMAGE"
          for platform in linux/amd64 linux/arm64; do
            echo "--- $platform ---"
            docker run --rm --platform "$platform" "$IMAGE" --help > help.txt
            grep -q -- '--ignore-indexing-state' help.txt
            grep -q -- '--no-pause' help.txt
            grep -q -- '--no-remember' help.txt
            echo "  help text carries the customizations"
            docker run --rm --platform "$platform" "$IMAGE" --version
            docker run --rm --platform "$platform" "$IMAGE" icloud --help | head -1
          done
